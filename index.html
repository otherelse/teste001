			this.y = 0;
			this.vx = 0;
			this.vy = 0;	
		}

			get pos2D (){
				return new Vector2D(this.x,this.y);

			},

				this.vx = velo.x;

					grad.addColorStop(1,this.color);

			var ctx = context;
			// location of origin (in pixels) in parent document
			var x_orig;
			var y_orig;
			// overall width and height of graph in pixels
			var x_width;
			var y_width;
			// min and max of x and y relative to origin (in pixels)
			var x_min_rel;
			var x_max_rel;
			var y_min_rel;
			var y_max_rel;
			// obvious
			var x_tick_major;
			var x_tick_minor;
			var y_tick_major;
			var y_tick_minor;
			// scaling used in displaying values on the axes 
			var x_displ_scal;
			var y_displ_scal;
			// width and height of textbox used for displaying values on the axes
			// this should not have to be tampered with (I hope)
			var tw=15;
			var th=20;
			// declarations for quantities to be used later
			var x_min;
			var x_max;
			var y_min;
			var y_max;
			var xx;
			var yy;
			var x_displ;
			var y_displ;
			var txpos;
			var typos;
		// PARAMETER ASSIGNMENTS	
			// assign parameter values based on specified arguments			
			x_orig=x0;
			y_orig=y0;
			x_width=xwidth;
			y_width=ywidth;
			//			
			x_displ_scal=(xmax-xmin)/xwidth;
			y_displ_scal=(ymax-ymin)/ywidth;		
			//		
			x_min_rel=xmin/x_displ_scal;
			x_max_rel=xmax/x_displ_scal;
			y_min_rel=ymin/y_displ_scal;
			y_max_rel=ymax/y_displ_scal;
			// convert to absolute coordinates				
			x_min=x_min_rel + x_orig;
			x_max=x_max_rel + x_orig;
			y_min=y_orig - y_min_rel;
			y_max=y_orig - y_max_rel;
			txpos=x_orig - tw;
			typos=y_orig;	
		// METHODS	
			// DRAW GRID: draw major, minor lines and display values
			this.drawgrid = function(xmajor,xminor,ymajor,yminor){		
				x_tick_major=xmajor/x_displ_scal;
				x_tick_minor=xminor/x_displ_scal;
				y_tick_major=ymajor/y_displ_scal;
				y_tick_minor=yminor/y_displ_scal;
				// draw major grid lines
				ctx.strokeStyle = '#999999';
				ctx.lineWidth = 1;		
				ctx.beginPath() ;			
				yy=y_max; //alert("draw grig");
				do {
					ctx.moveTo(x_min,yy);
					ctx.lineTo(x_max,yy);
					yy+= y_tick_major;
				} while (yy <= y_min);
				xx=x_min;
				do {
					ctx.moveTo(xx,y_min);
					ctx.lineTo(xx,y_max);
					xx+= x_tick_major;
				} while (xx <= x_max);
				ctx.stroke();						
				// draw minor grid lines			
				ctx.strokeStyle = '#cccccc';
				ctx.lineWidth = 1;	
				ctx.beginPath() ;			
				yy=y_max;
				do {
					ctx.moveTo(x_min,yy);
					ctx.lineTo(x_max,yy);
					yy+= y_tick_minor;
				} while (yy <= y_min);
				xx=x_min;
				do {
					ctx.moveTo(xx,y_min);
					ctx.lineTo(xx,y_max);
					xx+= x_tick_minor;
				} while (xx <= x_max);
				ctx.stroke();	
				//display values
				ctx.font = "10pt Arial";
				ctx.fillStyle = '#000000';
				ctx.textAlign = "right";
				ctx.textBaseline = "top";		
				yy=y_max;	
				do {
					y_displ=(y_orig - yy) * y_displ_scal;
					ctx.fillText(y_displ,txpos + 5,yy - th / 2);
					yy+= y_tick_major;
				} while (yy <= y_min);	
				ctx.textAlign = "left";
				ctx.textBaseline = "top";				
				xx=x_min;
				do {
					x_displ=(xx - x_orig) * x_displ_scal;
					ctx.fillText(x_displ,xx - tw + 10,typos + 5);			
					xx+= x_tick_major;
				} while (xx <= x_max);				
			};		
			// DRAW AXES: draw axes and labels		
			this.drawaxes = function (xlabel,ylabel){		
				if(typeof(xlabel)==='undefined') xlabel = 'x';
				if(typeof(ylabel)==='undefined') ylabel = 'y';		
				ctx.strokeStyle = '#000000';
				ctx.lineWidth = .05;
				ctx.beginPath() ;
				ctx.moveTo(x_min,y_orig);
				ctx.lineTo(x_max,y_orig);
				ctx.moveTo(x_orig,y_min);
				ctx.lineTo(x_orig,y_max);
				ctx.stroke();
				//axis labels
				ctx.font = "12pt Arial";
				ctx.fillStyle = '#000000';
				ctx.textAlign = "left";
				ctx.textBaseline = "top";
				ctx.fillText(xlabel,x_max + 0.75 * tw,typos - th / 2);
				ctx.fillText(ylabel,txpos + tw / 2 +5,y_max - 1.5 * th);
			};		
			// PLOT DATA: plot data
			this.plot = function (xArr, yArr, pColor, pDots, pLine){   
				// the last three arguments have default values
				if(typeof(pColor)==='undefined') pColor = '#0000ff';
				if(typeof(pDots)==='undefined') pDots = true;
				if(typeof(pLine)==='undefined') pLine = true;
					var xpos=x_orig+xArr[0]/x_displ_scal;
					var ypos=y_orig-yArr[0]/y_displ_scal;
						ctx.strokeStyle = pColor;
						ctx.lineWidth = 1;
						ctx.beginPath() ;			
						//ctx.moveTo(xpos,ypos);
						ctx.arc(xpos,ypos,5,0,2*Math.PI,true);   //  plots with minicirles
							//alert("in PLOT   xArr.length " + 	xArr.length);
								ctx.stroke();
									//stage.update();
		//=================================================================================================		
		//=================================================================================================		
				////for (var i=1; i<=xArr.length; i++){
				//	alert("i    "+i);;
				//	xpos=x_orig+xArr[i]/x_displ_scal;	
				//	ypos=y_orig-yArr[i]/y_displ_scal;	
				//	
				//	pLine = true;		pDots = false;
				//	//pLine = false; 	pDots = true;
				//	//pLine = true; 	pDots = true;
				//	//pLine = false; 	pDots = false;
				//	if (pLine){
				//		alert("in PLINE " + pLine);
				//			ctx.lineTo(xpos,ypos); 
				//				console.log("xpos, ypos " +  xpos + "   " +ypos);
				//				alert("PLINE  xpos, ypos " +  xpos + "   " +ypos);
				//					ctx.lineTo(500,500);ctx.lineTo(300,400);
				//						//ctx.stroke();			
				//	}else{
				//		ctx.moveTo(xpos,ypos);
				//			console.log("else  " +  pLine);
				//	}
				//	if (pDots){  
				//		alert("in PDOTS " + pLine);
				//			ctx.arc(xpos,ypos,5,0,2*Math.PI,true);		console.log("xpos  " +xpos);
				//	}
				////}
				ctx.stroke();	// essential???		
			};	
		}
		//vector2D.js
		function Vector2D(x,y) {
			this.x = x;
			this.y = y;		
		}		
		// PUBLIC METHODS	
		Vector2D.prototype = {		
			lengthSquared: function(){
				return this.x*this.x + this.y*this.y;
			},
			length: function(){
				return Math.sqrt(this.lengthSquared());
			},	
			clone: function() {
				return new Vector2D(this.x,this.y);
			},
			negate: function() {
				this.x = - this.x;
				this.y = - this.y;
			},
			normalize: function() {
				var length = this.length();
				if (length > 0) {
					this.x /= length;
					this.y /= length;
				}
				return this.length();
			},
			add: function(vec) {
				return new Vector2D(this.x + vec.x,this.y + vec.y);
			},
			incrementBy: function(vec) {
				this.x += vec.x;
				this.y += vec.y;
			},		
			subtract: function(vec) {
				return new Vector2D(this.x - vec.x,this.y - vec.y);
			},
			decrementBy: function(vec) {
				this.x -= vec.x;
				this.y -= vec.y;
			},		
			multiply: function(k) {
				return new Vector2D(k*this.x,k*this.y);
			},		
			addScaled: function(vec,k) {
				return new Vector2D(this.x + k*vec.x, this.y + k*vec.y);
			},	
			scaleBy: function(k) {
				this.x *= k;
				this.y *= k;
			},
			dotProduct:	function(vec) {
				return this.x*vec.x + this.y*vec.y;
			}
		};		
		// STATIC METHODS
		Vector2D.distance =  function(vec1,vec2){
			return (vec1.subtract(vec2)).length(); 
		}
		Vector2D.angleBetween = function(vec1,vec2){
			return Math.acos(vec1.dotProduct(vec2)/(vec1.length()*vec2.length()));
		}

	this.frame_99 = function() {
		this.stop();
		alert("Frame 100 sandbox");
		//energy example ********
		//originally in "Frame 25 sand box has bg canvas")
		var canvas = document.getElementById('canvas');
		var context = canvas.getContext('2d');
		var context_bg = context;
		var ctx = context;
		//energy example.html dependencies
		//graph.js">
		//vector2D.js
		//ball.js
		//energy-example.js
		//stage.addChild(ctx); //makes no difference
		//graph.js">
		function Graph(context, xmin, xmax, ymin, ymax, x0, y0, xwidth, ywidth) {
			// VARIABLE DECLARATIONS	
			// canvas context on which to draw graph instance 
			var ctx = context;
			// location of origin (in pixels) in parent document
			var x_orig;
			var y_orig;
			// overall width and height of graph in pixels
			var x_width;
			var y_width;
			// min and max of x and y relative to origin (in pixels)
			var x_min_rel;
			var x_max_rel;
			var y_min_rel;
			var y_max_rel;
			// obvious
			var x_tick_major;
			var x_tick_minor;
			var y_tick_major;
			var y_tick_minor;
			// scaling used in displaying values on the axes 
			var x_displ_scal;
			var y_displ_scal;
			// width and height of textbox used for displaying values on the axes
			// this should not have to be tampered with (I hope)
			var tw = 15;
			var th = 20;
			// declarations for quantities to be used later
			var x_min;
			var x_max;
			var y_min;
			var y_max;
			var xx;
			var yy;
			var x_displ;
			var y_displ;
			var txpos;
			var typos;
			//debugging
			/*var xpos;
			var ypos;*/
			// PARAMETER ASSIGNMENTS	
			// assign parameter values based on specified arguments			
			x_orig = x0;
			y_orig = y0;
			x_width = xwidth;
			y_width = ywidth;
			//			
			x_displ_scal = (xmax - xmin) / xwidth;
			y_displ_scal = (ymax - ymin) / ywidth;
			//		
			x_min_rel = xmin / x_displ_scal;
			x_max_rel = xmax / x_displ_scal;
			y_min_rel = ymin / y_displ_scal;
			y_max_rel = ymax / y_displ_scal;
			// convert to absolute coordinates				
			x_min = x_min_rel + x_orig;
			x_max = x_max_rel + x_orig;
			y_min = y_orig - y_min_rel;
			y_max = y_orig - y_max_rel;
			txpos = x_orig - tw;
			typos = y_orig;
			// METHODS	
			// DRAW GRID: draw major, minor lines and display values
			this.drawgrid = function (xmajor, xminor, ymajor, yminor) {
				x_tick_major = xmajor / x_displ_scal;
				x_tick_minor = xminor / x_displ_scal;
				y_tick_major = ymajor / y_displ_scal;
				y_tick_minor = yminor / y_displ_scal;
				// draw major grid lines
				ctx.strokeStyle = '#999999';
				ctx.lineWidth = 1;
				ctx.beginPath();
				yy = y_max; //\\alert("draw grig");
				do {
					ctx.moveTo(x_min, yy);
					ctx.lineTo(x_max, yy);
					yy += y_tick_major;
				} while (yy <= y_min);
				xx = x_min;
				do {
					//////ctx.moveTo(xx, y_min);
					ctx.lineTo(xx, y_max);
					xx += x_tick_major;
				} while (xx <= x_max);
				ctx.stroke();
				// draw minor grid lines			
				ctx.strokeStyle = '#cccccc';
				ctx.lineWidth = 1;
				ctx.beginPath();
				yy = y_max;
				do {
					ctx.moveTo(x_min, yy);
					ctx.lineTo(x_max, yy);
					yy += y_tick_minor;
				} while (yy <= y_min);
				xx = x_min;
				do {
					ctx.moveTo(xx, y_min);
					ctx.lineTo(xx, y_max);
					xx += x_tick_minor;
				} while (xx <= x_max);
				ctx.stroke();
				//display values
				ctx.font = "10pt Arial";
				ctx.fillStyle = '#000000';
				ctx.textAlign = "right";
				ctx.textBaseline = "top";
				yy = y_max;
				do {
					y_displ = (y_orig - yy) * y_displ_scal;
					ctx.fillText(y_displ, txpos + 5, yy - th / 2);
					yy += y_tick_major;
				} while (yy <= y_min);
				ctx.textAlign = "left";
				ctx.textBaseline = "top";
				xx = x_min;
				do {
					x_displ = (xx - x_orig) * x_displ_scal;
					ctx.fillText(x_displ, xx - tw + 10, typos + 5);
					xx += x_tick_major;
				} while (xx <= x_max);
			};
			// DRAW AXES: draw axes and labels		
			this.drawaxes = function (xlabel, ylabel) {
				if (typeof (xlabel) === 'undefined') xlabel = 'x';
				if (typeof (ylabel) === 'undefined') ylabel = 'y';
				ctx.strokeStyle = '#000000';
				ctx.lineWidth = .05;
				ctx.beginPath();
				ctx.moveTo(x_min, y_orig);
				ctx.lineTo(x_max, y_orig);
				ctx.moveTo(x_orig, y_min);
				ctx.lineTo(x_orig, y_max);
				ctx.stroke();
				//axis labels
				ctx.font = "12pt Arial";
				ctx.fillStyle = '#000000';
				ctx.textAlign = "left";
				ctx.textBaseline = "top";
				ctx.fillText(xlabel, x_max + 0.75 * tw, typos - th / 2);
				ctx.fillText(ylabel, txpos + tw / 2 + 5, y_max - 1.5 * th);
			};
			// PLOT DATA: plot data
			this.plot = function (xArr, yArr, pColor, pDots, pLine) {
				// the last three arguments have default values
				if (typeof (pColor) === 'undefined') pColor = '#0000ff';
				if (typeof (pDots) === 'undefined') pDots = true;
				if (typeof (pLine) === 'undefined') pLine = true;
		//debugging
		//xpos = 1300;// this value makes no difference
		//\\alert("xpos   =  "+ xpos);
		//\\alert("xArr[0]   =  "+ xArr[0]);
				var xpos = x_orig + xArr[0] / x_displ_scal;
				var ypos = y_orig - yArr[0] / y_displ_scal;
				ctx.strokeStyle = pColor;
				ctx.lineWidth = 2;
				ctx.beginPath();
				alert("xpos ypos  "+xpos + "  " +ypos);
		//		ctx.moveTo(xpos,ypos); //no difference
				ctx.arc(xpos, ypos, 10, 0, 2 * Math.PI, true); //  plots with minicirles
				//\\alert("in PLOT   xArr.length " + 	xArr.length);
				ctx.stroke();
				//stage.update();
				//=================================================================================================		
				//=================================================================================================		
				for (var i = 1; i <= xArr.length; i++) {
					//\\alert("i = " + i);
					//\\alert("xArr.length = " + xArr.length);
					xpos = x_orig + xArr[i] / x_displ_scal;
					ypos = y_orig - yArr[i] / y_displ_scal;
					//\\alert("xArr[i] = " + xArr[i]);
					//\\alert("yArr[i] = " + yArr[i]);
		//			pLine = true;
		//          pDots = false;
					pLine = false;
					pDots = true;
					//pLine = false; 	pDots = true;
					//pLine = true; 	pDots = true;
					//pLine = false; 	pDots = false;
					if (pLine) {
						//\\alert("in PLINE " + pLine);
						ctx.lineTo(xpos, ypos);
						//\\console.log("xpos, ypos " + xpos + "   " + ypos);
						//\\alert("PLINE  xpos, ypos " + xpos + "   " + ypos);
						ctx.lineTo(500, 500);
						ctx.lineTo(300, 400);
						//ctx.stroke();			
					} else {
						ctx.moveTo(xpos, ypos);
						console.log("else  " + pLine);
					}
					if (pDots) {
						//\\alert("in PDOTS " + pLine);
						ctx.arc(xpos, ypos, 5, 0, 2 * Math.PI, true);
						////console.log("xpos  " + xpos);
					}
				}
				ctx.stroke(); // essential???		
			}
		}
		//vector2D.js
		function Vector2D(x, y) {
			this.x = x;
			this.y = y;
		}
		// PUBLIC METHODS	
		Vector2D.prototype = {
			lengthSquared: function () {
				return this.x * this.x + this.y * this.y;
			},
			length: function () {
				return Math.sqrt(this.lengthSquared());
			},
			clone: function () {
				return new Vector2D(this.x, this.y);
			},
			negate: function () {
				this.x = -this.x;
				this.y = -this.y;
			},
			normalize: function () {
				var length = this.length();
				if (length > 0) {
					this.x /= length;
					this.y /= length;
				}
				return this.length();
			},
			add: function (vec) {
				return new Vector2D(this.x + vec.x, this.y + vec.y);
			},
			incrementBy: function (vec) {
				this.x += vec.x;
				this.y += vec.y;
			},
			subtract: function (vec) {
				return new Vector2D(this.x - vec.x, this.y - vec.y);
			},
			decrementBy: function (vec) {
				this.x -= vec.x;
				this.y -= vec.y;
			},
			multiply: function (k) {
				return new Vector2D(k * this.x, k * this.y);
			},
			addScaled: function (vec, k) {
				return new Vector2D(this.x + k * vec.x, this.y + k * vec.y);
			},
			scaleBy: function (k) {
				this.x *= k;
				this.y *= k;
			},
			dotProduct: function (vec) {
				return this.x * vec.x + this.y * vec.y;
			}
		};
		// STATIC METHODS
		Vector2D.distance = function (vec1, vec2) {
			return (vec1.subtract(vec2)).length();
		}
		Vector2D.angleBetween = function (vec1, vec2) {
			return Math.acos(vec1.dotProduct(vec2) / (vec1.length() * vec2.length()));
		}

		function Ball(radius, color, mass, charge, gradient) {
			if (typeof (radius) === 'undefined') radius = 20;
			if (typeof (color) === 'undefined') color = '#0000ff';
			if (typeof (mass) === 'undefined') mass = 1;
			if (typeof (charge) === 'undefined') charge = 0;
			if (typeof (gradient) === 'undefined') gradient = false;
			this.radius = radius;
			this.color = color;
			this.mass = mass;
			this.charge = charge;
			this.gradient = gradient;
			this.x = 0;
			this.y = 0;
			this.vx = 0;
			this.vy = 0;
		}
		Ball.prototype = {
			get pos2D() {
				return new Vector2D(this.x, this.y);
			},
			set pos2D(pos) {
				this.x = pos.x;
				this.y = pos.y;
			},
			get velo2D() {
				return new Vector2D(this.vx, this.vy);
			},
			set velo2D(velo) {
				this.vx = velo.x;

			if (applyThrust) {
